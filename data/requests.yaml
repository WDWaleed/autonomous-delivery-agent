# Active twists: fog_partial_observability, one_way_streets, fragile_parcel

- id: REQ-01
  level: single_constraint
  text: "Plan an optimal route to complete all 5 deliveries using A* with our own heuristic."
  expected_outcome: PLAN
  expected_tool: plan_route
  ground_truth_spec:
    algorithm: astar
    heuristic: own
    constraints: {}

