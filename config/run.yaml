# Run configuration and experimental parameters
# Governing decisions: D7, D12, D13

schedule:
  submission_target: "2026-11-28"
  viva_date: "2026-11-30"

n_scenarios: 30
n_games: 50
window_radius: 4
kappa: 1.5
return_to_depot: false

search_limits:
  max_expanded_nodes: 2000000
  timeout_seconds: 60
  track_memory: true

simulation:
  fallback_stay_cost: null  # dynamic fallback defaults to minimum terrain cost

llm:
  provider: "openai"
  model: "gpt-4o-mini"
  temperature: 0.0
  cache_path: "results/llm_cache.jsonl"
