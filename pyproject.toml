[project]
name = "oel-delivery-agent"
version = "0.1.0"
description = "Autonomous Delivery Agent under Uncertainty and Competition (CS-370 AI OEL Fall 2026)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "streamlit",
    "pytest",
    "pyyaml",
    "python-dotenv",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
]
addopts = "-m 'not slow'"
